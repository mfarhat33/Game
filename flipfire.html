<title>Flipfire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800&display=swap">
<style>
/* Layout: portrait arcade screen. Share bar and clock on top, tile field in the middle, energy and three powers under the thumb. */
:root{
  --bg:#F1F3F1; --panel:#FFFFFF; --fg:#16201D; --muted:#5A6763; --line:#D4DAD7; --a:#12A87C; --b:#DB3F74; --ice:#58B7E8; --gold:#C98A00;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1413; --panel:#16201E; --fg:#EDF3F1; --muted:#93A29D; --line:#28342F; --a:#1FC592; --b:#EE5587; --ice:#6CC6F2; --gold:#F2B735; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1413; --panel:#16201E; --fg:#EDF3F1; --muted:#93A29D; --line:#28342F; --a:#1FC592; --b:#EE5587; --ice:#6CC6F2; --gold:#F2B735; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.4;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px}
.top{display:flex;align-items:center;gap:10px}
.mark{font-family:var(--display);font-size:24px;line-height:1;margin:0;letter-spacing:.01em}
.mark i{font-style:normal;color:var(--a)}
.meta{margin-left:auto;display:flex;gap:6px;align-items:center}
.tag{font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.tag.coin{color:var(--gold)}
.tool{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px}
.tool:hover{border-color:var(--fg)}

.hud{display:flex;align-items:center;gap:10px;font-weight:800}
.share{flex:1;height:14px;border-radius:7px;background:var(--b);overflow:hidden}
.share span{display:block;height:100%;background:var(--a);width:50%}
.clock{font-family:var(--display);font-size:20px;min-width:2.2em;text-align:right}
.field{flex:1 1 auto;min-height:260px;position:relative}
.field canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:ew-resize}

.tray{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.energy{position:relative;flex:1;height:10px;border-radius:4px;background:var(--line);overflow:hidden}
.energy span{display:block;height:100%;width:0;background:var(--gold)}
.powers{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hint{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);min-height:1.4em}
.pow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-height:86px;gap:1px;text-align:left;display:flex;flex-direction:column;min-width:0}
.pow b{font-weight:800;font-size:13.5px;line-height:1.15;display:flex;justify-content:space-between;gap:6px}
.pow b i{font-style:normal;color:var(--gold)}
.pow span{font-size:11.5px;line-height:1.25;color:var(--muted);font-weight:700}
.pow:disabled{opacity:.42;cursor:default}
.pow.ready{border-color:var(--gold)}
.pow.sel{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pow.sel span{color:var(--bg);opacity:.75}
.pow u{text-decoration:none;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pow.sel u{color:var(--bg);opacity:.75}

.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.sheet h3{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sheet p{margin:0;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.opt > div{min-width:0;flex:1}
.opt b{display:block;font-weight:800}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt em{font-style:normal;font-weight:800;font-size:13px;white-space:nowrap}
.opt.sel{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.opt:disabled{opacity:.5;cursor:default}
.opt:not(:disabled):hover{border-color:var(--fg)}
.opt.sel:not(:disabled):hover{border-color:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:1px solid var(--line);background:none;border-radius:12px;padding:11px 14px;font-weight:800}
.btn.go{background:var(--a);border-color:var(--a);color:#06231A;font-family:var(--display);font-size:18px;font-weight:400}
.btn:hover{border-color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.energy::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--bg) calc(10% - 2px) 10%)}
.sheet.home{height:min(660px,100%);overflow:hidden}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.tab{flex:1 1 0;min-width:0;border:0;background:none;border-radius:9px;padding:8px 2px;font-weight:800;font-size:13.5px;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.pane{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cardrow{display:flex;gap:5px}
.cardrow .opt{flex:1 1 auto}
.rk{flex:none;width:74px;border:1px solid var(--line);border-radius:12px;background:none;padding:6px 4px;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rk small{color:var(--gold);font-size:12px}
.rk:disabled{opacity:.45;cursor:default}
.rk:not(:disabled):hover{border-color:var(--gold)}
</style>

<div class="app">
  <header class="top">
    <h1 class="mark">Flip<i>fire</i></h1>
    <div class="meta">
      <span class="tag num" id="tag-level">Stage 1</span>
      <span class="tag coin num" id="tag-coins">0 scrap</span>
      <button class="tool" id="btn-pause">Pause</button>
    </div>
  </header>
  <div class="hud">
    <span class="num" id="pct-a">50%</span>
    <div class="share" aria-hidden="true"><span id="share"></span></div>
    <span class="num" id="pct-b">50%</span>
    <span class="clock num" id="clock">60</span>
  </div>
  <div class="field" id="field"><canvas id="cv" aria-label="Tile field"></canvas></div>
  <section class="tray" aria-label="Your hand">
    <div class="erow"><div class="energy" aria-hidden="true"><span id="energy"></span></div><span class="num" id="energy-n">0/10</span></div>
    <div class="powers">
      <button class="pow" id="pow-0" disabled></button>
      <button class="pow" id="pow-1" disabled></button>
      <button class="pow" id="pow-2" disabled></button>
      <button class="pow" id="pow-3" disabled></button>
    </div>
    <p class="hint" id="hint"></p>
  </section>
</div>

<div class="veil" id="dlg-home">
  <div class="sheet home">
    <h2 id="home-title">Stage 1</h2>
    <div class="tabs" id="tabs">
      <button class="tab" data-tab="battle">Battle</button>
      <button class="tab" data-tab="deck">Deck</button>
      <button class="tab" data-tab="workshop">Workshop</button>
    </div>
    <div class="pane" id="tab-battle">
      <h3>How to play</h3>
      <p id="home-how"></p>
      <h3>This stage</h3>
      <p id="home-sub"></p>
    </div>
    <div class="pane" id="tab-deck" hidden><h3 id="deck-head">Deck</h3><div class="list" id="cards"></div></div>
    <div class="pane" id="tab-workshop" hidden><p>Scrap also raises card ranks in the Deck tab.</p><div class="list" id="upgrades"></div></div>
    <div class="row">
      <button class="btn" id="btn-sound">Sound on</button>
      <button class="btn go" id="btn-play">Play</button>
    </div>
  </div>
</div>

<div class="veil" id="dlg-over" hidden>
  <div class="sheet">
    <h2 id="over-title"></h2>
    <p id="over-sub"></p>
    <div class="row">
      <button class="btn" id="over-home">Workshop</button>
      <button class="btn go" id="over-next">Next stage</button>
    </div>
  </div>
</div>

<div class="veil" id="dlg-pause" hidden>
  <div class="sheet">
    <h2>Paused</h2>
    <p>Pick a card, then tap the lane you want it in. On a keyboard: 1 to 4 pick a card, the arrow keys move the lane, Enter plays it.</p>
    <div class="row">
      <button class="btn" id="pause-quit">Quit stage</button>
      <button class="btn go" id="pause-resume">Resume</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const COLS = 11, ROWS = 18, TIME = 75;
const CANNONS = {
  tapper:   { name:'Tapper',   unlock:1, gap:.15, speed:16, desc:'Quick single shots. Easy to steer.' },
  fork:     { name:'Fork',     unlock:2, gap:.42, speed:14, desc:'Three shots in a fan. Wide, loose.' },
  lance:    { name:'Lance',    unlock:4, gap:.5,  speed:26, desc:'One bolt that drills four tiles deep.' },
  mortar:   { name:'Mortar',   unlock:6, gap:.95, speed:9,  desc:'Slow shell that flips a 3 by 3 patch.' },
  ricochet: { name:'Ricochet', unlock:8, gap:.14, speed:14, desc:'Angled shots that bounce off the walls.' }
};
const UPG = {
  rapid:  { name:'Rapid loader', max:8, desc:'+7% fire rate per rank' },
  dynamo: { name:'Dynamo',       max:6, desc:'+10% energy flow per rank' },
  van:    { name:'Vanguard',     max:3, desc:'Start one row further up per rank' }
};
const CARDS = {
  overdrive:{ name:'Overdrive', cost:3, unlock:1, kind:'Boost',  desc:'Double fire rate for 5s' },
  drill:    { name:'Drill',     cost:3, unlock:1, kind:'Strike', desc:'Flip 5 tiles deep in the lane you tap' },
  sentry:   { name:'Sentry',    cost:4, unlock:1, kind:'Build',  desc:'Quick-firing turret in the lane you tap' },
  forkpost: { name:'Fork post', cost:4, unlock:2, kind:'Build',  desc:'Turret that fires a three-way fan' },
  mortarpost:{ name:'Mortar post', cost:5, unlock:6, kind:'Build', desc:'Turret that shells 3 by 3 patches' },
  plating:  { name:'Plating',   cost:3, unlock:1, kind:'Guard',  desc:'Armour your front two rows' },
  splash:   { name:'Splash',    cost:4, unlock:1, kind:'Strike', desc:'Flip a 5 by 3 patch at that lane\'s front' },
  jam:      { name:'Jam',       cost:4, unlock:1, kind:'Trick',  desc:'Stall every rival gun for 4s' },
  barrage:  { name:'Barrage',   cost:3, unlock:1, kind:'Strike', desc:'One shot up every lane at once' },
  stasis:   { name:'Stasis',    cost:2, unlock:1, kind:'Guard',  desc:'Wipe out rival shots in the air' },
  tide:     { name:'Tide',      cost:6, unlock:2, kind:'Strike', desc:'Push every lane forward 2 tiles' },
  capacitor:{ name:'Capacitor', cost:1, unlock:2, kind:'Boost',  desc:'Double energy flow for 8s' },
  shield:   { name:'Shield',    cost:3, unlock:3, kind:'Guard',  desc:'Your tiles shrug off shots for 3s' },
  crossfire:{ name:'Crossfire', cost:4, unlock:3, kind:'Strike', desc:'Hit the whole row at that lane\'s front' },
  split:    { name:'Split',     cost:4, unlock:4, kind:'Boost',  desc:'Every turret fires three lanes for 6s' },
  minefield:{ name:'Minefield', cost:3, unlock:4, kind:'Guard',  desc:'Mine 5 front tiles; they blast back' },
  heavy:    { name:'Heavy rounds', cost:4, unlock:5, kind:'Boost', desc:'Shots go one tile deeper for 6s' },
  sprinkler:{ name:'Sprinkler', cost:5, unlock:6, kind:'Build',  desc:'Turret whose shots bounce off walls' },
  broadhead:{ name:'Broadhead', cost:3, unlock:6, kind:'Boost',  desc:'Shots also hit both side tiles, 8s' },
  turncoat: { name:'Turncoat',  cost:5, unlock:7, kind:'Trick',  desc:'Every rival shot in the air turns' },
  pikepost: { name:'Pike post', cost:5, unlock:7, kind:'Build',  desc:'Turret whose bolts drill 4 deep' },
  wildfire: { name:'Wildfire',  cost:5, unlock:8, kind:'Strike', desc:'Flip 8 rival tiles along the front' },
  lockdown: { name:'Lockdown',  cost:4, unlock:8, kind:'Trick',  desc:'Rival cannot play cards for 6s' },
  meteor:   { name:'Meteor',    cost:7, unlock:9, kind:'Strike', desc:'Six blasts land on rival ground' },
  reclaim:  { name:'Reclaim',   cost:5, unlock:10, kind:'Guard', desc:'Take back the last 8 tiles you lost' }
};
const DECK = 8, HAND = 4, MAXE = 10, MAXRANK = 3;
const POSTS = { sentry:['tapper', 10, .2], forkpost:['fork', 9, .5], pikepost:['lance', 7, .55], mortarpost:['mortar', 9, 1], sprinkler:['ricochet', 8, .17] };
const rcost = r => 50*(r + 1)*(r + 1);
const cost = (k, r) => Math.round(40*(r + 1)*Math.pow(1.45, r));

const store = {
  get(d){ try { const v = localStorage.getItem('flipfire'); return v ? { ...d, ...JSON.parse(v) } : d; } catch { return d; } },
  set(v){ try { localStorage.setItem('flipfire', JSON.stringify(v)); } catch {} }
};
const P = store.get({ level:1, coins:0, up:{ rapid:0, dynamo:0, van:0 }, cannon:'tapper', sound:true, deck:['overdrive','drill','sentry','plating','splash','jam','barrage','stasis'] });
P.deck = (P.deck || []).filter(k => CARDS[k]).slice(0, DECK);
P.rank = P.rank || {};
let tab = 'battle';
if (!CANNONS[P.cannon]) P.cannon = 'tapper';

/* ---------- sound ---------- */
let actx = null, lastTick = 0;
function tone(f, d = .08, type = 'triangle', v = .05, when = 0){
  if (!P.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch {}
}
function tick(side){ const n = performance.now(); if (n - lastTick < 70) return; lastTick = n; tone(side ? 190 : 520 + Math.random()*120, .04, 'square', .018); }

/* ---------- match ---------- */
let M = null, paused = false;
const rivalCannon = n => ['tapper','tapper','fork','tapper','lance','fork','mortar','ricochet','lance','mortar'][(n - 1) % 10];
function newMatch(idle){
  const n = P.level, rowsMine = ROWS/2 + P.up.van;
  const owner = new Uint8Array(COLS*ROWS), hp = new Uint8Array(COLS*ROWS), mine = new Uint8Array(COLS*ROWS), flash = new Float32Array(COLS*ROWS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) owner[r*COLS + c] = r >= ROWS - rowsMine ? 0 : 1;
  // walls: fixed blocks that stop shots, mirrored so both sides face the same layout
  const W = (c, r) => { owner[r*COLS + c] = 2; owner[(ROWS - 1 - r)*COLS + (COLS - 1 - c)] = 2; };
  const pat = n < 4 ? 0 : n % 4;
  if (pat === 1){ W(2, 7); W(8, 7); }
  else if (pat === 2){ for (const c of [0, 1, 5, 9, 10]) W(c, 8); }
  else if (pat === 3){ W(5, 6); W(4, 8); W(6, 8); }
  if (n >= 3){
    let plates = Math.min(32, (n - 2)*4);
    while (plates-- > 0){ const i = Math.floor(Math.random()*COLS*(ROWS - rowsMine)); if (owner[i] === 1) hp[i] = 1; }
  }
  const g = true, boss = n % 5 === 0;
  const posts = Object.keys(POSTS).filter(k => CARDS[k].unlock <= n);
  let queue = P.deck.slice();
  if (g) queue = queue.filter(k => k !== 'decoy').concat(posts.filter(k => !P.deck.includes(k)));
  queue.sort(() => Math.random() - .5);
  while (queue.filter(k => POSTS[k]).length < 4) queue.splice(Math.floor(Math.random()*(queue.length + 1)), 0, 'sentry');
  { const at = queue.findIndex(k => POSTS[k]); if (at > 0) queue.unshift(queue.splice(at, 1)[0]); }
  const foe = ['overdrive','sentry'].concat(n >= 4 ? ['barrage'] : [], n >= 5 ? ['splash','plating'] : [], n >= 6 ? ['crossfire','minefield'] : [], n >= 7 ? ['tide','jam'] : [], n >= 8 ? ['wildfire','stasis'] : [], n >= 10 ? ['meteor','split','heavy'] : [], g ? posts.concat(posts) : []);
  M = { g, boss, sel:-1, lane:5, owner, hp, mine, flash, lost:[[], []], note:null, bullets:[], aux:[], t:TIME, idle:!!idle, over:false, aimT:0, target:COLS/2, queue, foe, foeNext:g ? 'sentry' : foe[0], handKey:'',
    sides:[
      { main:!g, x:COLS/2, cd:.4, type:P.cannon, rate:1 + .07*P.up.rapid, flow:(g ? .75 : .5)*(1 + .1*P.up.dynamo), energy:g ? 5 : 2, over:0, frozen:0, split:0, shield:0, decoy:0, cap:0, heavy:0, wide:0, lock:0, alt:1 },
      { main:!g, x:COLS/2, cd:.6, type:rivalCannon(n), rate:Math.min(1.4, .7 + .05*n)*(boss ? 1.15 : 1), flow:Math.min(.9, .3 + .04*n), energy:2, over:0, frozen:0, split:0, shield:0, decoy:0, cap:0, heavy:0, wide:0, lock:0, alt:1 }
    ] };
  for (const side of [0, 1]) for (const x of idle ? [2.5, 5.5, 8.5] : [5.5]) M.aux.push({ x, side, type:'tapper', cd:.3 + .2*side, life:idle ? 999 : 16, gap:.2, alt:1 });
  if (boss && !idle) for (const x of [2.5, 8.5]) M.aux.push({ x, side:1, type:'tapper', cd:.3, life:999, gap:.3, alt:1 });
}
function shoot(side, x, type, T){
  if (x < 0 || x > COLS) return;
  const C = CANNONS[type], dir = side ? 1 : -1, y = side ? .01 : ROWS - .01;
  const b = vx => M.bullets.push({ x:Math.min(COLS - .05, Math.max(.05, x)), y, vx, vy:dir*C.speed, side, pierce:(type === 'lance' ? 3 : 0) + (M.sides[side].heavy > 0 ? 1 : 0), kind:type });
  if (type === 'fork'){ b(-4); b(0); b(4); }
  else if (type === 'ricochet'){ b(T.alt*7); T.alt = -T.alt; }
  else b(0);
}
function fire(side){
  const S = M.sides[side];
  shoot(side, S.x, S.type, S);
  if (S.split > 0){ shoot(side, S.x - 1.5, S.type, S); shoot(side, S.x + 1.5, S.type, S); }
  S.cd = CANNONS[S.type].gap/(S.rate*(S.over > 0 ? 2 : 1));
}
function flip(i, side){
  if (M.owner[i] === 2) return;
  if (M.owner[i] === 1 - side) M.lost[1 - side].push(i);
  M.owner[i] = side; M.hp[i] = 0; M.mine[i] = 0; M.flash[i] = 1;
  const S = M.sides[side]; S.energy = Math.min(MAXE, S.energy + .025);
  tick(side);
}
function strike(i, side){ if (M.owner[i] !== 1 - side) return; if (M.hp[i] > 0){ M.hp[i]--; M.flash[i] = .6; } else flip(i, side); }
/* Returns true when the bullet is spent. */
function hit(b, c, r){
  const i = r*COLS + c;
  if (M.owner[i] === b.side) return false;
  if (M.owner[i] === 2) return true;
  if (M.mine[i]){ M.mine[i] = 0; M.flash[i] = 1; blast(M.owner[i], c, r); tone(130, .18, 'sine', .05); return true; }
  if (M.sides[M.owner[i]].shield > 0){ M.flash[i] = .35; return true; }
  if (M.hp[i] > 0){ M.hp[i]--; M.flash[i] = .6; return true; }
  flip(i, b.side);
  if (M.sides[b.side].wide > 0){ if (c > 0) strike(i - 1, b.side); if (c < COLS - 1) strike(i + 1, b.side); }
  if (b.kind === 'mortar'){
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
      const cc = c + dc, rr = r + dr;
      if ((dc || dr) && cc >= 0 && rr >= 0 && cc < COLS && rr < ROWS) strike(rr*COLS + cc, b.side);
    }
    tone(110, .16, 'sine', .05);
  }
  return --b.pierce < 0;
}
function tide(side, depth = 2){
  for (let c = 0; c < COLS; c++){
    let left = depth;
    for (let k = 0; k < ROWS && left; k++){
      const r = side ? k : ROWS - 1 - k, i = r*COLS + c;
      if (M.owner[i] === 1 - side){ flip(i, side); left--; }
    }
  }
  tone(180, .3, 'sawtooth', .04); tone(360, .35, 'triangle', .05, .08);
}
const fwd = side => side ? 1 : -1, base = side => side ? 0 : ROWS - 1;
const lane = S => Math.min(COLS - 1, Math.max(0, Math.floor(S.x)));

/* ---------- input ---------- */
function aim(e, tap){
  if (!live()) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - geo.gx)/geo.t;
  if (!M.g){ M.sides[0].x = Math.min(COLS - .5, Math.max(.5, x)); return; }
  if (x < 0 || x >= COLS) return;
  M.lane = Math.floor(x);
  if (tap){ if (M.sel >= 0) playAt(M.sel, M.lane); else M.note = { text:'Pick a card first', side:0, t:1 }; }
}
cv.addEventListener('pointerdown', e => { try { if (M && !M.g) cv.setPointerCapture(e.pointerId); } catch {} aim(e, true); });
cv.addEventListener('pointermove', e => aim(e, false));
document.addEventListener('keydown', e => {
  const left = e.key === 'ArrowLeft' || e.key === 'a', right = e.key === 'ArrowRight' || e.key === 'd';
  if (M && M.g && live()){
    if (left) M.lane = Math.max(0, M.lane - 1);
    else if (right) M.lane = Math.min(COLS - 1, M.lane + 1);
    else if ((e.key === 'Enter' || e.key === ' ') && M.sel >= 0){ e.preventDefault(); playAt(M.sel, M.lane); }
  } else if (left) keyDir = -1; else if (right) keyDir = 1;

  else if (e.key === 'Escape' || e.key === 'p') pause(!paused);
});

for (let k = 0; k < HAND; k++) $('pow-' + k).addEventListener('click', () => power(k));

}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

    + (boss ? ' Boss stage: two fixed rival turrets and a faster rival, for double scrap.' : '');
  $('deck-head').textContent = `Deck · ${P.deck.length} of ${DECK} chosen`;
  $('cards').innerHTML = Object.entries(CARDS).map(([k, c]) => {
    const open = P.level >= c.unlock, on = P.deck.includes(k), r = P.rank[k] || 0, full = r >= MAXRANK;
    return `<div class="cardrow"><button class="opt${on ? ' sel' : ''}" data-card="${k}" ${open && (on || P.deck.length < DECK) ? '' : 'disabled'}><div><b>${c.name} · ${c.cost}</b><small>${c.kind} · ${c.desc}</small></div><em>${!open ? 'Stage ' + c.unlock : on ? 'In deck' : 'Add'}</em></button>`
      + `<button class="rk" data-rank="${k}" aria-label="Raise ${c.name} rank" ${open && !full && P.coins >= rcost(r) ? '' : 'disabled'}>Rank ${r + 1}<small class="num">${full ? 'max' : rcost(r)}</small></button></div>`;
  }).join('');
  $('btn-play').disabled = P.deck.length !== DECK;
  $('btn-play').textContent = P.deck.length === DECK ? 'Play' : `Pick ${DECK - P.deck.length} more`;
  $('upgrades').innerHTML = Object.entries(UPG).map(([k, u]) => {
    const r = P.up[k], full = r >= u.max, c = cost(k, r);
    return `<button class="opt" data-up="${k}" ${full || P.coins < c ? 'disabled' : ''}><div><b>${u.name} · rank ${r}/${u.max}</b><small>${u.desc}</small></div><em class="num">${full ? 'Maxed' : c + ' scrap'}</em></button>`;
  }).join('');
  $('dlg-over').hidden = true; $('dlg-pause').hidden = true; $('dlg-home').hidden = false;
  paused = false; newMatch(true);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; home(); });
$('cards').addEventListener('click', e => {
  const u = e.target.closest('[data-rank]');
  if (u && !u.disabled){
    const k = u.dataset.rank, r = P.rank[k] || 0; if (r >= MAXRANK || P.coins < rcost(r)) return;
    P.coins -= rcost(r); P.rank[k] = r + 1; store.set(P); tone(700, .1); tone(1050, .12, 'triangle', .05, .07);
    const top = $('tab-deck').scrollTop; home(); $('tab-deck').scrollTop = top; return;
  }
  const b = e.target.closest('[data-card]'); if (!b || b.disabled) return;
  const k = b.dataset.card, at = P.deck.indexOf(k);
  if (at >= 0) P.deck.splice(at, 1); else if (P.deck.length < DECK) P.deck.push(k);
  store.set(P); tone(520, .06);
  const top = $('tab-deck').scrollTop; home(); $('tab-deck').scrollTop = top;
});
$('upgrades').addEventListener('click', e => {
  const b = e.target.closest('[data-up]'); if (!b || b.disabled) return;
  const k = b.dataset.up, c = cost(k, P.up[k]); if (P.coins < c) return;
  P.coins -= c; P.up[k]++; store.set(P); tone(700, .1); tone(1050, .12, 'triangle', .05, .07); home();
});
function play(){ if (P.deck.length !== DECK) return; $('dlg-home').hidden = true; $('dlg-over').hidden = true; paused = false; newMatch(false); tone(440, .1); }
$('btn-play').addEventListener('click', play);
$('over-next').addEventListener('click', play);
$('over-home').addEventListener('click', home);
$('btn-sound').addEventListener('click', () => { P.sound = !P.sound; store.set(P); chrome(); tone(660, .1); });
$('btn-pause').addEventListener('click', () => pause(true));
$('pause-resume').addEventListener('click', () => pause(false));
$('pause-quit').addEventListener('click', home);

window.__flipfire = { P, play:() => play(), state:() => M, run(bot){ while (!M.over){ bot(M, power, playAt); step(1/30); } return share(); } };
new ResizeObserver(layout).observe($('field'));
layout(); home(); requestAnimationFrame(frame);
})();
</script>
